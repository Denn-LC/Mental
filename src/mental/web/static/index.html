<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mental</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-heat="0">
  <header>
    <h1>mental</h1>
  </header>
  <main>
    <section id="players" class="screen" hidden>
      <h2>who's playing?</h2>
      <div id="player-list"></div>
      <div class="buttons">
        <input id="new-name" data-nav maxlength="16" placeholder="new player" aria-label="new player's name" autocomplete="off" spellcheck="false">
        <button id="add-player" data-nav>Add</button>
      </div>
      <p id="player-error" class="error" aria-live="polite"></p>
      <p class="keys">arrows choose · Enter go · type a new name and Enter to add</p>
    </section>

    <section id="home" class="screen" hidden>
      <p id="playing-as"></p>
      <button class="choice" data-nav data-mode="practice">Practice</button>
      <button class="choice" data-nav data-mode="test">Test Yourself · 2 min</button>
      <button class="choice" data-nav id="players-choice">Switch player</button>
      <p class="keys">arrows choose · Enter go</p>
    </section>

    <section id="options" class="screen" hidden>
      <fieldset>
        <legend>topics</legend>
        <label><input type="checkbox" data-nav name="topic" value="addition" checked> addition</label>
        <label><input type="checkbox" data-nav name="topic" value="subtraction" checked> subtraction</label>
        <label><input type="checkbox" data-nav name="topic" value="multiplication" checked> multiplication</label>
        <label><input type="checkbox" data-nav name="topic" value="division" checked> division</label>
        <label><input type="checkbox" data-nav name="topic" value="percentage" checked> percentages</label>
        <label><input type="checkbox" data-nav name="topic" value="relationship" checked> relationships</label>
      </fieldset>
      <fieldset>
        <legend>level</legend>
        <label><input type="radio" data-nav name="level" value="1" checked> 1 easy</label>
        <label><input type="radio" data-nav name="level" value="2"> 2 medium</label>
        <label><input type="radio" data-nav name="level" value="3"> 3 hard</label>
        <label><input type="radio" data-nav name="level" value="mixed"> mixed</label>
      </fieldset>
      <button id="play" class="choice" data-nav>Play</button>
      <p id="menu-error" class="error" aria-live="polite"></p>
      <p class="keys">arrows move · Enter/Space tick · Esc back</p>
    </section>

    <section id="game" class="screen" hidden>
      <p id="settings"></p>
      <p id="stats"><span id="timer"></span> <span id="score">score 0</span> <span id="streak">streak 0</span></p>
      <div id="question"></div>
      <input id="answer" aria-label="answer" inputmode="numeric" autocomplete="off" spellcheck="false">
      <div id="practice-buttons" class="buttons">
        <button id="submit">Enter</button>
        <button id="give-up">Give up</button>
        <button id="quit">Quit</button>
      </div>
      <div id="test-buttons" class="buttons">
        <button id="skip">Skip</button>
      </div>
      <div class="buttons"><button id="retry" hidden>Retry</button></div>
      <div id="feedback" aria-live="polite"></div>
      <ol id="steps"></ol>
      <section id="results" hidden></section>
      <p id="keys" class="keys"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
